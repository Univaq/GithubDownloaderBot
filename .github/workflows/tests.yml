name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q bot.py handlers keyboards repositories services workers src tests
      - run: BOT_TOKEN=123456:TEST_TOKEN python -c "import bot"
      - run: python -m pytest -q
