[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "github-downloader-bot"
version = "0.1.0"
description = "Telegram bot for searching GitHub repositories and downloading assets"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4.0",
  "httpx>=0.27,<1.0",
  "aiosqlite>=0.20,<1.0",
  "python-dotenv>=1.0,<2.0",
  "Markdown>=3.7,<4.0",
  "bleach>=6.2,<7.0",
  "aiofiles>=23.2,<25.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<2.0", "ruff>=0.9,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
